<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Un Día Especial</title>
  <style>
    body { background-color: #0d0714; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
    .container { max-width: 400px; width: 100%; text-align: center; }
    h1 { color: #ff6699; font-size: 2rem; margin-bottom: 8px; }
    p.quote { font-style: italic; color: #cccccc; font-size: 0.95rem; margin-bottom: 25px; }
    .video-card { border: 2px solid #331d4a; border-radius: 16px; padding: 10px; background: #150b24; box-shadow: 0 0 20px rgba(255, 102, 153, 0.2); }
    video { width: 100%; border-radius: 12px; outline: none; }
    footer { margin-top: 30px; font-size: 0.85rem; color: #aaaaaa; }
    footer span { color: #ff6699; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Un Día Especial</h1>
    <p class="quote">"Un día encuentras a esa persona que solo verla te cambia el ánimo..."</p>
    <div class="video-card">
      <video controls>
        <source src="video.mp4" type="video/mp4">
        Tu navegador no soporta la reproducción de video.
      </video>
    </div>
    <footer> Hecho con <span>♥</span> para guardar este recuerdo </footer>
  </div>
</body>
  </html>
